name: Validate source (deployment is manual)
on:
  push:
    branches: ['production']
  pull_request:
    branches: ['production']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: npm
      - run: npm ci
      - run: npm run build
# Production deployment is deliberately not triggered by PRs/pushes.
# Preserve server-side database secrets; follow docs/POSTGRESQL-CUTOVER.md.
