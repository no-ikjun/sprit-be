name: CI/CD (k3s)

on:
  push:
    branches: [production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight production deployment. The host also locks across repos.
concurrency:
  group: k3s-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the production branch for manual deployments
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != 'refs/heads/production' ]; then
            echo 'Select production in the Run workflow branch dropdown.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.8'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Build application
        working-directory: .
        run: npm run build
      - name: Check PostgreSQL runtime contract
        run: node scripts/ci/check-postgres-contract.cjs

  release:
    needs: validate
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: no-ikjun/lightsail-infra/.github/workflows/k3s-release.yml@a8be44ec039b6c56d9df0ebf2c89f435ee05329b
    with:
      service: sprit
      production_branch: production
      image_repository: docker.io/ikjunchoi/sprit
      dockerfile: Dockerfile
      build_context: .
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
      LIGHTSAIL_USERNAME: ${{ secrets.LIGHTSAIL_USERNAME }}
      LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
